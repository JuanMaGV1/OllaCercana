$kind: http-request
url: "{{base_url}}/reservas/{{reserva_id}}/calificacion"
method: POST
body:
  type: json
  content: '{ "estrellas": 5, "comentario": "Excelente" }'
auth:
  type: bearer
  credentials:
    token: "{{token_comprador}}"
scripts:
  - type: afterResponse
    code: pm.test("201 Created", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 5000
