$kind: http-request
url: "{{base_url}}/reservas/{{reserva_id}}/mensajes"
method: POST
body:
  type: json
  content: '{ "texto": "Hola, ya voy en camino" }'
auth:
  type: bearer
  credentials:
    token: "{{token_comprador}}"
scripts:
  - type: afterResponse
    code: pm.test("201 Created", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
